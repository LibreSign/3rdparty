name: Compile Command

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  init:
    runs-on: ubuntu-latest

    # On pull requests and if the comment starts with `/composer-update`
    if: github.event.issue.pull_request != '' && github.event.comment.body == '/composer-update'

    outputs:
      head_ref: ${{ steps.comment-branch.outputs.head_ref }}
      head_sha: ${{ steps.comment-branch.outputs.head_sha }}
      status_id: ${{ steps.ack.outputs.status_id }}

    steps:
      - name: Get repository from pull request comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: get-repository
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            const pull = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            const repositoryName = pull.data.head?.repo?.full_name
            console.log(repositoryName)
            return repositoryName

      - name: Disabled on forks
        if: ${{ fromJSON(steps.get-repository.outputs.result) != github.repository }}
        run: |
          echo 'Can not execute /composer-update on forks'
          exit 1

      - name: Check actor permission
        uses: skjnldsv/check-actor-permission@69e92a3c4711150929bca9fcf34448c5bf5526e7 # v3.0
        with:
          require: write

      - name: Init branch
        uses: xt0rted/pull-request-comment-branch@e8b8daa837e8ea7331c0003c9c316a64c6d8b0b1 # v3.0.0
        id: comment-branch

      - name: Checkout trusted feedback helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: Create scoped feedback token
        id: feedback-token
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.WORKFLOW_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.WORKFLOW_SYNC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-pull-requests: write
          permission-issues: write

      - name: Acknowledge command and link run
        id: ack
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          STATUS_MODE: start
          RUN_ID: ${{ github.run_id }}
        with:
          github-token: ${{ steps.feedback-token.outputs.token || github.token }}
          script: |
            const {sendFeedback} = require('./.github/scripts/composer-feedback.js')
            await sendFeedback({github, context, core, env: process.env})
  process:
    runs-on: ubuntu-latest
    needs: init
    outputs:
      commit_sha: ${{ steps.vendor.outputs.commit_sha }}
      changed: ${{ steps.vendor.outputs.changed }}

    steps:
      - name: Checkout ${{ needs.init.outputs.head_ref }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.init.outputs.head_sha }}

      - name: Set up php
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: 8.3
          coverage: none

      - name: Update composer
        run: sudo composer self-update && composer --version

      - name: Delete dependencies
        run: |
          rm -rf ./composer/*/
          rm -rf ./vendor/*/

      - name: Download dependencies
        run: composer install --no-dev

      - name: Remove tests and other untracked files
        run: git clean -X -d -f

      - name: Dump Autoload
        run: composer dump-autoload

      - name: Create scoped GitHub App token
        id: workflow-app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.WORKFLOW_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.WORKFLOW_SYNC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Resolve verified GitHub App bot identity
        id: signer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APP_SLUG: ${{ steps.workflow-app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          [[ "$APP_SLUG" =~ ^[a-zA-Z0-9-]+$ ]] || exit 1
          bot_user_id="$(gh api "users/${APP_SLUG}[bot]" --jq '.id')"
          [[ "$bot_user_id" =~ ^[0-9]+$ ]] || exit 1
          echo "name=${APP_SLUG}[bot]" >> "$GITHUB_OUTPUT"
          echo "email=${bot_user_id}+${APP_SLUG}[bot]@users.noreply.github.com" >> "$GITHUB_OUTPUT"

      - name: Commit verified scoped vendor changes
        id: vendor
        uses: LibreCodeCoop/.github/actions/commit-generated-vendor@ceba40c6087165248735a47c81f1b0c1ac3dace6 # source pinned
        with:
          token: ${{ steps.workflow-app-token.outputs.token }}
          source-head: ${{ needs.init.outputs.head_sha }}
          head-ref: ${{ needs.init.outputs.head_ref }}
          signer-name: ${{ steps.signer.outputs.name }}
          signer-email: ${{ steps.signer.outputs.email }}

  notify:
    runs-on: ubuntu-latest
    needs: [init, process]
    if: always() && github.event.issue.pull_request != '' && github.event.comment.body == '/composer-update'
    steps:
      - name: Checkout trusted feedback helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: Create scoped feedback token
        id: feedback-token
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.WORKFLOW_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.WORKFLOW_SYNC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-pull-requests: write
          permission-issues: write

      - name: Update command status and reaction
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          STATUS_MODE: finish
          FEEDBACK_APP_SLUG: ${{ steps.feedback-token.outputs.app-slug }}
          RUN_ID: ${{ github.run_id }}
          STATUS_COMMENT_ID: ${{ needs.init.outputs.status_id }}
          INIT_RESULT: ${{ needs.init.result }}
          PROCESS_RESULT: ${{ needs.process.result }}
          COMMIT_SHA: ${{ needs.process.outputs.commit_sha }}
          CHANGED: ${{ needs.process.outputs.changed }}
        with:
          github-token: ${{ steps.feedback-token.outputs.token || github.token }}
          script: |
            const {sendFeedback} = require('./.github/scripts/composer-feedback.js')
            await sendFeedback({github, context, core, env: process.env})
