name: Compile Command

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  init:
    runs-on: ubuntu-latest

    # On pull requests and if the comment starts with `/composer-update`
    if: github.event.issue.pull_request != '' && startsWith(github.event.comment.body, '/composer-update')

    outputs:
      head_ref: ${{ steps.comment-branch.outputs.head_ref }}

    steps:
      - name: Get repository from pull request comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: get-repository
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            const pull = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            const repositoryName = pull.data.head?.repo?.full_name
            console.log(repositoryName)
            return repositoryName

      - name: Disabled on forks
        if: ${{ fromJSON(steps.get-repository.outputs.result) != github.repository }}
        run: |
          echo 'Can not execute /composer-update on forks'
          exit 1

      - name: Check actor permission
        uses: skjnldsv/check-actor-permission@69e92a3c4711150929bca9fcf34448c5bf5526e7 # v3.0
        with:
          require: write

      - name: Add reaction on start
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          token: ${{ github.token }}
          repository: ${{ github.event.repository.full_name }}
          comment-id: ${{ github.event.comment.id }}
          reactions: '+1'

      - name: Init branch
        uses: xt0rted/pull-request-comment-branch@e8b8daa837e8ea7331c0003c9c316a64c6d8b0b1 # v3.0.0
        id: comment-branch

      - name: Add reaction on failure
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        if: failure()
        with:
          token: ${{ github.token }}
          repository: ${{ github.event.repository.full_name }}
          comment-id: ${{ github.event.comment.id }}
          reactions: '-1'

  process:
    runs-on: ubuntu-latest
    needs: init

    steps:
      - name: Checkout ${{ needs.init.outputs.head_ref }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.init.outputs.head_ref }}

      - name: Setup git
        run: |
          git config --local user.email 'libresign-command@users.noreply.github.com'
          git config --local user.name 'libresign-command'

      - name: Set up php
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: 8.3
          coverage: none

      - name: Update composer
        run: sudo composer self-update && composer --version

      - name: Delete dependencies
        run: |
          rm -rf ./composer/*/
          rm -rf ./vendor/*/

      - name: Download dependencies
        run: composer install --no-dev

      - name: Remove tests and other untracked files
        run: git clean -X -d -f

      - name: Dump Autoload
        run: composer dump-autoload

      - name: Create scoped GitHub App token
        id: workflow-app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.WORKFLOW_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.WORKFLOW_SYNC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Commit and push regenerated dependencies
        env:
          HEAD_REF: ${{ needs.init.outputs.head_ref }}
          GH_TOKEN: ${{ steps.workflow-app-token.outputs.token }}
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo 'No regenerated files changed'
            exit 0
          fi
          git -c core.hooksPath=/dev/null commit --signoff -m 'chore(autoloader): Regenerate scoped dependencies'
          gh auth setup-git
          git -c core.hooksPath=/dev/null push origin "HEAD:$HEAD_REF"

      - name: Add reaction on failure
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        if: failure()
        with:
          token: ${{ github.token }}
          repository: '${{ github.event.repository.full_name }}'
          comment-id: '${{ github.event.comment.id }}'
          reactions: '-1'
