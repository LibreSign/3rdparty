version: 2
updates:
- package-ecosystem: "github-actions"
  directory: "/"
  commit-message:
    prefix: "ci"
    include: "scope"
  schedule:
    interval: "monthly"
  cooldown:
    default-days: 7

- package-ecosystem: composer
  directory: "/"
  schedule:
    interval: "weekly"
  open-pull-requests-limit: 20
  commit-message:
    prefix: "build"
    include: "scope"
  versioning-strategy: "increase"
  rebase-strategy: "disabled"
  cooldown:
    default-days: 7
  labels:
    - "dependencies"
    - "main"
  groups:
    symfony:
      applies-to: version-updates
      patterns:
        - "symfony/*"

- package-ecosystem: composer
  directory: "/"
  target-branch: stable33
  schedule:
    interval: "weekly"
  open-pull-requests-limit: 20
  commit-message:
    prefix: "build"
    include: "scope"
  versioning-strategy: "increase"
  rebase-strategy: "disabled"
  cooldown:
    default-days: 7
  ignore:
    - dependency-name: "*"
      update-types: ["version-update:semver-major", "version-update:semver-minor"]
  labels:
    - "dependencies"
    - "stable33"
  groups:
    symfony:
      applies-to: version-updates
      patterns:
        - "symfony/*"

